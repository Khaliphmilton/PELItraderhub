<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connect Deriv | PELItradershub</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .connect-page {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 30px 20px;
    }

    .connect-card {
      width: 100%;
      max-width: 500px;
      background: #0d121c;
      border: 1px solid #202838;
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .connect-card h1 {
      margin-bottom: 10px;
    }

    .connect-card p {
      color: #7d879b;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .deriv-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #786cff, #39d4b6);
      color: #061016;
      font-weight: 900;
      cursor: pointer;
      font-size: 15px;
    }

    .deriv-button:hover {
      opacity: .9;
    }

    .status {
      margin-top: 20px;
      color: #7d879b;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header class="navbar">

  <a href="index.html" class="brand">
    <span class="brand-icon">P</span>
    <span>PELI<span>tradershub</span></span>
  </a>

  <div class="nav-actions">

    <a href="dashboard.html" class="button secondary">
      Dashboard
    </a>

  </div>

</header>


<main class="connect-page">

  <section class="connect-card">

    <h1>Connect Deriv</h1>

    <p>
      Connect your Deriv account securely to PELItradershub.
      You will be redirected to Deriv to sign in and authorize
      the connection.
    </p>

    <button
      type="button"
      id="connectDeriv"
      class="deriv-button"
    >
      Connect Deriv Account
    </button>

    <div
      id="status"
      class="status"
    >
      Your Deriv password will never be entered into PELItradershub.
    </div>

  </section>

</main>


<script>

const CLIENT_ID =
  "34aZNrTmY1AZc7hjuxyLv";

const REDIRECT_URI =
  "https://pelitradershub.vercel.app/api/deriv/callback";


function generateCodeVerifier() {

  const array =
    new Uint8Array(64);

  crypto.getRandomValues(array);

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let result = "";

  for (let i = 0; i < array.length; i++) {

    result +=
      characters[
        array[i] % characters.length
      ];

  }

  return result;
}


async function generateCodeChallenge(
  verifier
) {

  const data =
    new TextEncoder().encode(
      verifier
    );

  const digest =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(digest)
    )
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");

}


function generateState() {

  const array =
    new Uint8Array(32);

  crypto.getRandomValues(array);

  return Array
    .from(array)
    .map(
      byte =>
        byte
          .toString(16)
          .padStart(2, "0")
    )
    .join("");

}


document
  .getElementById("connectDeriv")
  .addEventListener(
    "click",
    async function () {

      const button =
        document.getElementById(
          "connectDeriv"
        );

      const status =
        document.getElementById(
          "status"
        );


      try {

        button.disabled = true;

        button.textContent =
          "Preparing secure connection...";


        const codeVerifier =
          generateCodeVerifier();


        const codeChallenge =
          await generateCodeChallenge(
            codeVerifier
          );


        const state =
          generateState();


        /*
          Save PKCE information before
          leaving PELItradershub.
        */

        sessionStorage.setItem(
          "deriv_code_verifier",
          codeVerifier
        );


        sessionStorage.setItem(
          "deriv_oauth_state",
          state
        );


        /*
          Build Deriv OAuth URL.
        */

        const authUrl =
          new URL(
            "https://auth.deriv.com/oauth2/auth"
          );


        authUrl.searchParams.set(
          "response_type",
          "code"
        );


        authUrl.searchParams.set(
          "client_id",
          CLIENT_ID
        );


        authUrl.searchParams.set(
          "redirect_uri",
          REDIRECT_URI
        );


        authUrl.searchParams.set(
          "scope",
          "trade"
        );


        authUrl.searchParams.set(
          "state",
          state
        );


        authUrl.searchParams.set(
          "code_challenge",
          codeChallenge
        );


        authUrl.searchParams.set(
          "code_challenge_method",
          "S256"
        );


        status.textContent =
          "Redirecting to Deriv...";


        window.location.href =
          authUrl.toString();


      } catch (error) {

        console.error(error);


        status.textContent =
          "Unable to start the Deriv connection.";


        button.disabled = false;

        button.textContent =
          "Connect Deriv Account";

      }

    }
  );

</script>

</body>
</html>
