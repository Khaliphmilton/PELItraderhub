<script>

/* =========================================================
   PELItradershub — LIVE CHART ENGINE
   ========================================================= */

(() => {

  "use strict";


  const chartCard =
    document.getElementById(
      "peli-chart-card"
    );

  const chart =
    document.getElementById(
      "peli-price-chart"
    );

  const line =
    document.getElementById(
      "peli-line"
    );

  const area =
    document.getElementById(
      "peli-area"
    );

  const livePoint =
    document.getElementById(
      "peli-live-point"
    );

  const liveBubble =
    document.getElementById(
      "peli-live-bubble"
    );

  const currentPrice =
    document.getElementById(
      "peli-current-price"
    );

  const priceMovement =
    document.getElementById(
      "peli-price-movement"
    );

  const chartDigit =
    document.getElementById(
      "peli-chart-digit"
    );

  const chartDirection =
    document.getElementById(
      "peli-chart-direction"
    );

  const chartTicks =
    document.getElementById(
      "peli-chart-ticks"
    );

  const currentDigit =
    document.getElementById(
      "peli-current-digit"
    );

  const statLast =
    document.getElementById(
      "peli-stat-last"
    );

  const statPrevious =
    document.getElementById(
      "peli-stat-previous"
    );

  const statCount =
    document.getElementById(
      "peli-stat-count"
    );

  const statPrice =
    document.getElementById(
      "peli-stat-price"
    );

  const recentDigits =
    document.getElementById(
      "peli-recent-digits"
    );

  const marketStatus =
    document.getElementById(
      "peli-market-status"
    );

  const liveDot =
    document.getElementById(
      "peli-live-dot"
    );

  const yAxis =
    document.getElementById(
      "peli-y-axis"
    );


  let prices = [];

  let digits = [];

  let lastPrice = null;

  let previousPrice = null;

  let maxPoints = 200;


  /* =======================================================
     NUMBER FORMAT
     ======================================================= */

  function formatPrice(value) {

    if (
      value === null ||
      value === undefined ||
      !Number.isFinite(Number(value))
    ) {
      return "--";
    }

    const n = Number(value);

    return n.toFixed(
      n < 100
        ? 4
        : 2
    );
  }


  /* =======================================================
     DRAW CHART
     ======================================================= */

  function drawChart() {

    if (!chart || !line || !area) {
      return;
    }

    if (!prices.length) {

      line.setAttribute(
        "d",
        ""
      );

      area.setAttribute(
        "d",
        ""
      );

      return;
    }


    const width = 1000;

    const height = 500;

    const paddingX = 20;

    const paddingTop = 25;

    const paddingBottom = 75;


    let min =
      Math.min(...prices);

    let max =
      Math.max(...prices);


    if (min === max) {

      min -= 0.01;

      max += 0.01;
    }


    const range =
      max - min;


    const extra =
      range * 0.12;


    min -= extra;

    max += extra;


    const usableWidth =
      width -
      paddingX * 2;


    const usableHeight =
      height -
      paddingTop -
      paddingBottom;


    const points =
      prices.map(
        (price, index) => {

          const x =
            paddingX +
            (
              index /
              Math.max(
                prices.length - 1,
                1
              )
            ) *
            usableWidth;


          const y =
            paddingTop +
            (
              (max - price) /
              (max - min)
            ) *
            usableHeight;


          return {
            x,
            y,
            price
          };

        }
      );


    const path =
      points
        .map(
          (point, index) =>
            `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
        )
        .join(" ");


    const first =
      points[0];

    const last =
      points[points.length - 1];


    const areaPath =
      `${path}
       L ${last.x} ${height - paddingBottom}
       L ${first.x} ${height - paddingBottom}
       Z`;


    line.setAttribute(
      "d",
      path
    );


    area.setAttribute(
      "d",
      areaPath
    );


    livePoint.setAttribute(
      "cx",
      last.x
    );

    livePoint.setAttribute(
      "cy",
      last.y
    );


    renderYAxis(
      min,
      max
    );

  }


  /* =======================================================
     Y AXIS
     ======================================================= */

  function renderYAxis(
    min,
    max
  ) {

    if (!yAxis) {
      return;
    }

    yAxis.innerHTML = "";

    const steps = 5;

    for (
      let i = 0;
      i < steps;
      i++
    ) {

      const value =
        max -
        (
          (max - min) *
          i /
          (steps - 1)
        );


      const span =
        document.createElement(
          "span"
        );

      span.textContent =
        formatPrice(value);

      yAxis.appendChild(
        span
      );
    }
  }


  /* =======================================================
     DIGIT UI
     ======================================================= */

  function updateDigits() {

    const counts =
      Array(10).fill(0);


    digits.forEach(
      digit => {

        if (
          Number.isInteger(digit) &&
          digit >= 0 &&
          digit <= 9
        ) {
          counts[digit]++;
        }

      }
    );


    const total =
      digits.length;


    document
      .querySelectorAll(
        "#peli-digit-grid .peli-digit"
      )
      .forEach(
        button => {

          const digit =
            Number(
              button.dataset.digit
            );

          const percentage =
            total
              ? (
                  counts[digit] /
                  total
                ) *
                100
              : 0;


          const small =
            button.querySelector(
              "small"
            );


          if (small) {

            small.textContent =
              `${percentage.toFixed(1)}%`;
          }

        }
      );


    const recent =
      digits.slice(-40);


    if (!recent.length) {

      recentDigits.textContent =
        "Waiting for live ticks...";

      return;
    }


    recentDigits.innerHTML =
      "";


    recent.forEach(
      digit => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "peli-recent-digit";

        item.textContent =
          digit;

        recentDigits.appendChild(
          item
        );

      }
    );

  }


  /* =======================================================
     PROCESS TICK
     ======================================================= */

  function handleTick(data) {

    if (!data) {
      return;
    }


    const quote =
      Number(
        data.quote
      );


    if (
      !Number.isFinite(quote)
    ) {
      return;
    }


    previousPrice =
      lastPrice;

    lastPrice =
      quote;


    prices.push(
      quote
    );


    if (
      prices.length >
      maxPoints
    ) {

      prices =
        prices.slice(
          -maxPoints
        );
    }


    let digit =
      data.lastDigit;


    if (
      digit === undefined ||
      digit === null
    ) {

      const text =
        String(
          quote
        );

      const match =
        text.match(
          /(\d)\s*$/
        );


      if (match) {

        digit =
          Number(
            match[1]
          );

      }

    }


    if (
      Number.isInteger(digit)
    ) {

      digits.push(
        digit
      );

      if (
        digits.length >
        500
      ) {

        digits =
          digits.slice(
            -500
          );

      }

    }


    /* PRICE */

    currentPrice.textContent =
      formatPrice(
        quote
      );

    statPrice.textContent =
      formatPrice(
        quote
      );


    liveBubble.textContent =
      formatPrice(
        quote
      );


    /* DIGIT */

    if (
      Number.isInteger(digit)
    ) {

      currentDigit.textContent =
        digit;

      chartDigit.textContent =
        digit;

      statLast.textContent =
        digit;


      document
        .querySelectorAll(
          ".peli-digit"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "live",
              Number(
                button.dataset.digit
              ) === digit
            );

          }
        );

    }


    /* PREVIOUS */

    if (
      data.previousDigit !==
      undefined &&
      data.previousDigit !== null
    ) {

      statPrevious.textContent =
        data.previousDigit;

    }


    /* MOVEMENT */

    if (
      previousPrice !== null
    ) {

      if (
        quote >
        previousPrice
      ) {

        priceMovement.textContent =
          "▲ UP";

        chartDirection.textContent =
          "UP";

        priceMovement.style.color =
          "#32d9b6";

        chartDirection.style.color =
          "#32d9b6";

      }

      else if (
        quote <
        previousPrice
      ) {

        priceMovement.textContent =
          "▼ DOWN";

        chartDirection.textContent =
          "DOWN";

        priceMovement.style.color =
          "#ff647c";

        chartDirection.style.color =
          "#ff647c";

      }

      else {

        priceMovement.textContent =
          "— FLAT";

        chartDirection.textContent =
          "FLAT";

      }

    }


    const count =
      prices.length;


    chartTicks.textContent =
      count;

    statCount.textContent =
      count;


    drawChart();

    updateDigits();

  }


  /* =======================================================
     HISTORY
     ======================================================= */

  function handleHistory(data) {

    if (!data) {
      return;
    }


    if (
      Array.isArray(
        data.prices
      )
    ) {

      prices =
        data.prices
          .map(Number)
          .filter(
            Number.isFinite
          )
          .slice(
            -maxPoints
          );


      drawChart();

      chartTicks.textContent =
        prices.length;

      statCount.textContent =
        prices.length;

    }


    if (
      Array.isArray(
        data.counts
      )
    ) {

      digits = [];

      data.counts.forEach(
        (count, digit) => {

          for (
            let i = 0;
            i < Number(count);
            i++
          ) {

            digits.push(
              digit
            );

          }

        }
      );


      digits =
        digits.slice(
          -500
        );


      updateDigits();

    }

  }


  /* =======================================================
     CONNECTION STATUS
     ======================================================= */

  function handleStatus(data) {

    if (!data) {
      return;
    }


    if (
      data.publicConnected
    ) {

      liveDot.classList.add(
        "connected"
      );

      marketStatus.textContent =
        "CONNECTED";

    }

    else {

      liveDot.classList.remove(
        "connected"
      );

      marketStatus.textContent =
        "CONNECTING";

    }

  }


  /* =======================================================
     RESET
     ======================================================= */

  document
    .getElementById(
      "peli-reset-chart"
    )
    ?.addEventListener(
      "click",
      () => {

        prices = [];

        digits = [];

        lastPrice = null;

        previousPrice = null;

        drawChart();

        updateDigits();

        chartTicks.textContent =
          "0";

        statCount.textContent =
          "0";

      }
    );


  /* =======================================================
     FULLSCREEN
     ======================================================= */

  document
    .getElementById(
      "peli-fullscreen"
    )
    ?.addEventListener(
      "click",
      async () => {

        try {

          if (
            !document.fullscreenElement
          ) {

            await chartCard.requestFullscreen();

          }

          else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            "Fullscreen error:",
            error
          );

        }

      }
    );


  /* =======================================================
     DERIV EVENTS
     ======================================================= */

  function attachDeriv() {

    if (
      !window.PELI_DERIV ||
      typeof
      window.PELI_DERIV.on !==
      "function"
    ) {

      setTimeout(
        attachDeriv,
        300
      );

      return;
    }


    window.PELI_DERIV.on(
      "tick",
      handleTick
    );


    window.PELI_DERIV.on(
      "history",
      handleHistory
    );


    window.PELI_DERIV.on(
      "status",
      handleStatus
    );


    /* =====================================================
       LOAD CURRENT STATE IMMEDIATELY
       ===================================================== */

    const existingTicks =
      window.PELI_DERIV
        .getRecentTicks?.();


    if (
      Array.isArray(
        existingTicks
      ) &&
      existingTicks.length
    ) {

      existingTicks.forEach(
        tick => {

          handleTick({
            quote:
              tick.quote,

            lastDigit:
              tick.digit,

            epoch:
              tick.epoch
          });

        }
      );

    }


    const stats =
      window.PELI_DERIV
        .getDigitStats?.();


    if (
      stats &&
      Array.isArray(
        stats.counts
      )
    ) {

      updateDigits();

    }

  }


  attachDeriv();


})();

</script>
