<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | PELItradershub</title>

  <meta
    name="description"
    content="Sign in to your PELItradershub trading workspace."
  >

  <link rel="stylesheet" href="styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <style>

    .auth-page {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 40px 20px;

      background:
        radial-gradient(
          circle at 50% 20%,
          #24204b 0,
          transparent 45%
        );
    }


    .auth-card {
      width: 100%;
      max-width: 460px;

      background: #0d121c;

      border: 1px solid #202838;

      border-radius: 20px;

      padding: 35px;

      box-shadow:
        0 25px 80px rgba(0,0,0,.35);
    }


    .auth-logo {
      text-align: center;
      margin-bottom: 25px;
    }


    .auth-logo .brand {
      justify-content: center;
      font-size: 20px;
    }


    .auth-card h1 {
      font-size: 30px;
      text-align: center;
      margin-bottom: 8px;
    }


    .auth-description {
      text-align: center;
      color: #7d879b;
      font-size: 14px;
      margin-bottom: 28px;
    }


    .auth-group {
      margin-bottom: 18px;
    }


    .auth-group label {
      display: block;

      font-size: 12px;

      color: #8b95a8;

      margin-bottom: 7px;
    }


    .auth-input {
      width: 100%;

      box-sizing: border-box;

      padding: 14px;

      border-radius: 10px;

      border: 1px solid #293246;

      background: #0a0e16;

      color: white;

      outline: none;

      font-size: 14px;
    }


    .auth-input:focus {
      border-color: #786cff;
    }


    .password-wrapper {
      position: relative;
    }


    .password-wrapper .auth-input {
      padding-right: 65px;
    }


    .show-password {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      background: transparent;

      border: 0;

      color: #8b95a8;

      cursor: pointer;
    }


    .forgot-row {
      text-align: right;

      margin-top: -5px;

      margin-bottom: 20px;
    }


    .forgot-row button {
      background: transparent;

      border: 0;

      color: #9a91ff;

      cursor: pointer;

      font-size: 12px;

      padding: 0;
    }


    .auth-submit {
      width: 100%;

      padding: 14px;

      border: 0;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          #786cff,
          #39d4b6
        );

      color: #061016;

      font-weight: 900;

      cursor: pointer;
    }


    .auth-submit:disabled {
      opacity: .6;
      cursor: wait;
    }


    .status-message {
      display: none;

      margin-top: 18px;

      padding: 12px;

      border-radius: 9px;

      font-size: 12px;

      line-height: 1.5;
    }


    .status-message.success {
      display: block;

      background: #102c28;

      border: 1px solid #1e5a4e;

      color: #39d4b6;
    }


    .status-message.error {
      display: block;

      background: #351923;

      border: 1px solid #713345;

      color: #ff7186;
    }


    .auth-footer {
      text-align: center;

      color: #7d879b;

      font-size: 13px;

      margin-top: 25px;
    }


    .auth-footer a {
      color: #39d4b6;

      font-weight: 700;
    }


    @media(max-width:500px) {

      .auth-card {
        padding: 25px 20px;
      }

    }

  </style>

</head>


<body>


<header class="navbar">

  <a href="index.html" class="brand">

    <span class="brand-icon">
      P
    </span>

    <span>
      PELI<span>tradershub</span>
    </span>

  </a>


  <div class="nav-actions">

    <a
      href="index.html"
      class="login-link"
    >
      Home
    </a>

    <a
      href="register.html"
      class="button secondary"
    >
      Create account
    </a>

  </div>

</header>



<main class="auth-page">


  <section class="auth-card">


    <div class="auth-logo">

      <a
        href="index.html"
        class="brand"
      >

        <span class="brand-icon">
          P
        </span>

        <span>
          PELI<span>tradershub</span>
        </span>

      </a>

    </div>



    <h1>
      Welcome back
    </h1>


    <p class="auth-description">
      Sign in to your PELItradershub workspace.
    </p>



    <form id="loginForm">


      <div class="auth-group">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          class="auth-input"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>



      <div class="auth-group">

        <label for="password">
          Password
        </label>


        <div class="password-wrapper">

          <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          >


          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            Show
          </button>

        </div>

      </div>



      <div class="forgot-row">

        <button
          type="button"
          id="forgotPassword"
        >
          Forgot password?
        </button>

      </div>



      <button
        type="submit"
        class="auth-submit"
      >
        Sign In
      </button>


      <div
        id="statusMessage"
        class="status-message"
      ></div>


    </form>



    <div class="auth-footer">

      Don't have an account?

      <a href="register.html">
        Create one
      </a>

    </div>


  </section>

</main>



<script>


/* =========================
   SHOW / HIDE PASSWORD
========================= */


document
  .getElementById("showPassword")
  .addEventListener(
    "click",
    function() {

      const input =
        document.getElementById("password");


      if(input.type === "password") {

        input.type = "text";

        this.textContent = "Hide";

      } else {

        input.type = "password";

        this.textContent = "Show";

      }

    }
  );



/* =========================
   STATUS FUNCTIONS
========================= */


function showError(message) {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message error";


  status.textContent =
    message;

}


function showSuccess(message) {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message success";


  status.textContent =
    message;

}


function clearStatus() {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message";


  status.textContent =
    "";

}



/* =========================
   LOGIN
========================= */


document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const button =
        document.querySelector(
          ".auth-submit"
        );


      clearStatus();


      if(!email) {

        showError(
          "Please enter your email address."
        );

        return;

      }


      if(!password) {

        showError(
          "Please enter your password."
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "Signing in...";


      try {


        if(
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase is not loaded. Check supabase.js."
          );

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if(error) {

          throw error;

        }


        if(!data.session) {

          throw new Error(
            "Login was not completed. Please try again."
          );

        }


        showSuccess(
          "Login successful. Opening your dashboard..."
        );


        setTimeout(
          function() {

            window.location.href =
              "dashboard.html";

          },
          800
        );


      } catch(error) {


        console.error(
          "Login error:",
          error
        );


        let message =
          error.message ||
          "Login failed. Please try again.";


        if(
          message
            .toLowerCase()
            .includes("email not confirmed")
        ) {

          message =
            "Please confirm your email address before signing in.";

        }


        if(
          message
            .toLowerCase()
            .includes("invalid login credentials")
        ) {

          message =
            "Incorrect email or password.";

        }


        showError(message);


        button.disabled = false;

        button.textContent =
          "Sign In";

      }

    }
  );



/* =========================
   FORGOT PASSWORD
========================= */


document
  .getElementById("forgotPassword")
  .addEventListener(
    "click",
    async function() {


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      if(!email) {

        showError(
          "Enter your email address first, then tap Forgot password."
        );

        return;

      }


      try {


        if(
          typeof supabaseClient ===
          "undefined"
        ) {

          throw new Error(
            "Supabase is not loaded."
          );

        }


        const {
          error
        } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                "/reset-password.html"
            }
          );


        if(error) {

          throw error;

        }


        showSuccess(
          "Password reset instructions have been sent to your email."
        );


      } catch(error) {


        console.error(
          "Password reset error:",
          error
        );


        showError(
          error.message ||
          "Unable to send password reset email."
        );

      }

    }
  );

</script>


</body>

</html>
