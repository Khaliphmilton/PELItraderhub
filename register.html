<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Create Account | PELItradershub</title>

<meta
  name="description"
  content="Create your PELItradershub trading workspace."
>

<link rel="stylesheet" href="styles.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<style>

.auth-page {
  min-height: calc(100vh - 72px);
  display: grid;
  place-items: center;
  padding: 40px 20px;

  background:
    radial-gradient(
      circle at 50% 20%,
      #24204b 0,
      transparent 45%
    );
}


.auth-card {
  width: 100%;
  max-width: 460px;

  background: #0d121c;

  border: 1px solid #202838;

  border-radius: 20px;

  padding: 35px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.35);
}


.auth-logo {
  text-align: center;
  margin-bottom: 25px;
}


.auth-logo .brand {
  justify-content: center;
  font-size: 20px;
}


.auth-card h1 {
  font-size: 30px;
  text-align: center;
  margin-bottom: 8px;
}


.auth-description {
  text-align: center;

  color: #7d879b;

  font-size: 14px;

  margin-bottom: 28px;
}


.auth-group {
  margin-bottom: 17px;
}


.auth-group label {
  display: block;

  font-size: 12px;

  color: #8b95a8;

  margin-bottom: 7px;
}


.auth-input {
  width: 100%;

  padding: 14px;

  border-radius: 10px;

  border: 1px solid #293246;

  background: #0a0e16;

  color: white;

  outline: none;

  font-size: 14px;

  box-sizing: border-box;
}


.auth-input:focus {
  border-color: #786cff;
}


.password-wrapper {
  position: relative;
}


.password-wrapper .auth-input {
  padding-right: 65px;
}


.show-password {
  position: absolute;

  right: 10px;

  top: 50%;

  transform: translateY(-50%);

  background: transparent;

  border: 0;

  color: #8b95a8;

  cursor: pointer;
}


.password-strength {
  height: 4px;

  background: #202838;

  border-radius: 10px;

  margin-top: 8px;

  overflow: hidden;
}


.password-strength div {
  height: 100%;

  width: 0;

  transition: .2s;
}


.strength-text {
  color: #68748a;

  font-size: 10px;

  margin-top: 5px;
}


.terms {
  display: flex;

  align-items: flex-start;

  gap: 8px;

  color: #7d879b;

  font-size: 11px;

  line-height: 1.5;

  margin: 18px 0;
}


.terms input {
  margin-top: 3px;
}


.auth-submit {
  width: 100%;

  padding: 14px;

  border: 0;

  border-radius: 10px;

  background:
    linear-gradient(
      135deg,
      #786cff,
      #39d4b6
    );

  color: #061016;

  font-weight: 900;

  cursor: pointer;
}


.auth-submit:disabled {
  opacity: .6;

  cursor: wait;
}


.auth-footer {
  text-align: center;

  color: #7d879b;

  font-size: 13px;

  margin-top: 25px;
}


.auth-footer a {
  color: #39d4b6;

  font-weight: 700;
}


.status-message {
  display: none;

  margin-top: 18px;

  padding: 12px;

  border-radius: 9px;

  font-size: 12px;

  line-height: 1.5;
}


.status-message.success {
  display: block;

  background: #102c28;

  border: 1px solid #1e5a4e;

  color: #39d4b6;
}


.status-message.error {
  display: block;

  background: #351923;

  border: 1px solid #713345;

  color: #ff7186;
}


@media(max-width:500px) {

  .auth-card {
    padding: 25px 20px;
  }

}

</style>

</head>


<body>


<header class="navbar">

<a href="index.html" class="brand">

<span class="brand-icon">
P
</span>

<span>
PELI<span>tradershub</span>
</span>

</a>


<div class="nav-actions">

<a
  href="index.html"
  class="login-link"
>
Home
</a>


<a
  href="login.html"
  class="button secondary"
>
Log in
</a>

</div>

</header>



<main class="auth-page">


<section class="auth-card">


<div class="auth-logo">

<a
  href="index.html"
  class="brand"
>

<span class="brand-icon">
P
</span>

<span>
PELI<span>tradershub</span>
</span>

</a>

</div>



<h1>
Create your account
</h1>


<p class="auth-description">
Build your trading workspace with PELItradershub.
</p>



<form id="registerForm">


<div class="auth-group">

<label for="name">
Full name
</label>

<input
  id="name"
  class="auth-input"
  type="text"
  placeholder="Your name"
  autocomplete="name"
  required
>

</div>



<div class="auth-group">

<label for="email">
Email address
</label>

<input
  id="email"
  class="auth-input"
  type="email"
  placeholder="you@example.com"
  autocomplete="email"
  required
>

</div>



<div class="auth-group">

<label for="password">
Password
</label>


<div class="password-wrapper">

<input
  id="password"
  class="auth-input"
  type="password"
  placeholder="Create a strong password"
  autocomplete="new-password"
  minlength="8"
  required
>


<button
  type="button"
  class="show-password"
  onclick="togglePassword('password', this)"
>
Show
</button>

</div>


<div class="password-strength">

<div id="strengthBar"></div>

</div>


<div
  id="strengthText"
  class="strength-text"
>
Use at least 8 characters.
</div>

</div>



<div class="auth-group">

<label for="confirmPassword">
Confirm password
</label>


<div class="password-wrapper">

<input
  id="confirmPassword"
  class="auth-input"
  type="password"
  placeholder="Repeat your password"
  autocomplete="new-password"
  minlength="8"
  required
>


<button
  type="button"
  class="show-password"
  onclick="togglePassword('confirmPassword', this)"
>
Show
</button>

</div>

</div>



<label class="terms">

<input
  type="checkbox"
  id="terms"
  required
>

<span>
I agree to the platform terms and understand that
trading involves financial risk.
</span>

</label>



<button
  type="submit"
  class="auth-submit"
>
Create Account
</button>


<div
  id="statusMessage"
  class="status-message"
></div>


</form>



<div class="auth-footer">

Already have an account?

<a href="login.html">
Sign in
</a>

</div>


</section>

</main>



<script>


function togglePassword(id, button) {

  const input =
    document.getElementById(id);


  if(input.type === "password") {

    input.type = "text";

    button.textContent = "Hide";

  } else {

    input.type = "password";

    button.textContent = "Show";

  }

}



const password =
  document.getElementById("password");


const strengthBar =
  document.getElementById("strengthBar");


const strengthText =
  document.getElementById("strengthText");


password.addEventListener(
  "input",
  function() {

    const value =
      password.value;

    let strength = 0;


    if(value.length >= 8)
      strength++;


    if(/[A-Z]/.test(value))
      strength++;


    if(/[0-9]/.test(value))
      strength++;


    if(/[^A-Za-z0-9]/.test(value))
      strength++;


    const widths = [
      "0%",
      "25%",
      "50%",
      "75%",
      "100%"
    ];


    strengthBar.style.width =
      widths[strength];


    if(strength <= 1) {

      strengthText.textContent =
        "Weak password";

    }

    else if(strength === 2) {

      strengthText.textContent =
        "Fair password";

    }

    else if(strength === 3) {

      strengthText.textContent =
        "Good password";

    }

    else {

      strengthText.textContent =
        "Strong password";

    }

  }

);



const registerForm =
  document.getElementById("registerForm");


registerForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const status =
      document.getElementById(
        "statusMessage"
      );


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    const terms =
      document
        .getElementById("terms")
        .checked;



    if(!name) {

      showError(
        "Please enter your name."
      );

      return;

    }



    if(password.length < 8) {

      showError(
        "Password must contain at least 8 characters."
      );

      return;

    }



    if(password !== confirmPassword) {

      showError(
        "Passwords do not match."
      );

      return;

    }



    if(!terms) {

      showError(
        "Please accept the terms."
      );

      return;

    }



    const button =
      document.querySelector(
        ".auth-submit"
      );


    button.disabled = true;

    button.textContent =
      "Creating account...";


    clearStatus();



    try {


      if(
        typeof supabaseClient ===
        "undefined"
      ) {

        throw new Error(
          "Supabase is not loaded. Check supabase.js."
        );

      }



      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              full_name: name

            },

            emailRedirectTo:
              window.location.origin +
              "/dashboard.html"

          }

        });



      if(error) {

        throw error;

      }



      if(data.session) {

        showSuccess(
          "Account created successfully. Redirecting..."
        );


        setTimeout(
          function() {

            window.location.href =
              "dashboard.html";

          },
          1200
        );


        return;

      }



      showSuccess(
        "Account created! Check your email and click the confirmation link before signing in."
      );


      button.disabled = false;

      button.textContent =
        "Create Account";


    }

    catch(error) {


      console.error(
        "Registration error:",
        error
      );


      showError(
        error.message ||
        "Registration failed. Please try again."
      );


      button.disabled = false;

      button.textContent =
        "Create Account";

    }

  }
);



function showError(message) {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message error";


  status.textContent =
    message;

}



function showSuccess(message) {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message success";


  status.textContent =
    message;

}



function clearStatus() {

  const status =
    document.getElementById(
      "statusMessage"
    );


  status.className =
    "status-message";


  status.textContent =
    "";

}

</script>


</body>

</html>
